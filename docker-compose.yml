version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lala-web
    ports:
      - '3000:3000'
    restart: always
    environment:
      - DATABASE_URL=file:./dev.db
      - ADMIN_JWT_SECRET=lala-secret-salt-key-2026-dynamic-token-signing
    volumes:
      - ./prisma:/app/prisma

  postgres:
    image: postgres:15-alpine
    container_name: lala-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: lala_admin
      POSTGRES_PASSWORD: lala_secure_password
      POSTGRES_DB: lala_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
