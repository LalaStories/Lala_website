services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lala-web
    ports:
      - '3000:3000'
    restart: always
    # Values come from a local .env file (gitignored) or the host environment.
    # Never hardcode credentials here — this file is committed.
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      - NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY=${NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - NODE_ENV=production
    volumes:
      # Persist uploaded videos and images across deploys & restarts
      - lala_assets:/app/public/assets

volumes:
  lala_assets:
    driver: local
